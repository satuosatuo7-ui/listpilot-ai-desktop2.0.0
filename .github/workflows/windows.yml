name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test security policies
        run: npm test
      - name: Build Windows x64 NSIS installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate installer checksum
        run: |
          $exe = Get-ChildItem release/*Setup*.exe
          if ($exe.Count -ne 1) { throw 'Expected one installer' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Upload Windows EXE and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ListPilot-AI-Windows-x64
          path: |
            release/*Setup*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Test packaged application launch
        run: npm run smoke:win
      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-launch-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
